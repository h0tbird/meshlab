---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: grafana
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - name: mnger-1
        server: https://kubernetes.default.svc
  template:
    metadata:
      name: {{`'{{name}}-grafana'`}}
      labels:
        name: grafana
    spec:
      project: monitoring
      source:
        repoURL: https://grafana.github.io/helm-charts
        targetRevision: {{ .Values.chartVersion }}
        chart: grafana
        helm:
          releaseName: grafana
          valuesObject:
            adminPassword: meshlab123
            adminUser: admin
            # The chart ships no initialDelaySeconds and periodSeconds defaults
            # to 10, so the first probe races Grafana's HTTP listener and losing
            # it costs a full 10s of idle NotReady, which is exactly what was
            # observed (container start 11:23:59 -> Ready 11:24:09, to the
            # second). Poll every 2s to bound the miss.
            readinessProbe:
              httpGet:
                path: /api/health
                port: grafana
              periodSeconds: 2
            # Keep every grafana.ini setting under this one key. These arrived in
            # two unrelated commits a month apart, each adding its own
            # `grafana.ini`, and the later one silently won: anonymous auth was
            # configured but never rendered, so the UI asked for a login for
            # months. feature_toggles backs the "Grafana git sync" step.
            grafana.ini:
              auth.anonymous:
                enabled: true
                # Must name an org that exists. This said "MeshLab", which is
                # never created, so once the key clash above was fixed every
                # anonymous request failed with "organization not found" and
                # bounced back to /login. "Main Org." is Grafana's built-in
                # default org.
                org_name: Main Org.
                # Editor (not Viewer) so anonymous clients — including the
                # mcp-grafana MCP server — can create and update dashboards.
                org_role: Editor
              feature_toggles:
                provisioning: true
                kubernetesDashboards: true
            datasources:
              datasources.yaml:
                apiVersion: 1
                datasources:
                - name: Prometheus
                  type: prometheus
                  access: proxy
                  orgId: 1
                  url: http://prometheus-server.monitoring.svc
                  isDefault: true
            service:
              type: LoadBalancer
              port: 80
              annotations:
                  coredns.io/hostname: grafana.demo.lab
      destination:
        server: {{`'{{server}}'`}}
        namespace: monitoring
