{{- if eq .Values.dataplaneMode "ambient" -}}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: istio-ztunnel
  namespace: argocd
spec:
  generators:
  - clusters:
      selector:
        matchLabels:
          argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: {{`'{{name}}-istio-ztunnel'`}}
      labels:
        name: istio-ztunnel
    spec:
      project: istio
      source:
        repoURL: https://blob.istio.io/istio-release/charts
        targetRevision: {{ .Values.chartVersion }}
        chart: ztunnel
        helm:
          releaseName: istio-ztunnel
          valuesObject:
{{- if .Values.imageHub }}
            hub: {{ .Values.imageHub | quote }}
{{- end }}
{{- if .Values.imageTag }}
            tag: {{ .Values.imageTag | quote }}
{{- end }}
{{- if or .Values.imageHub .Values.imageTag (ne .Values.imageVariant "debug") }}
            variant: {{ .Values.imageVariant | quote }}
{{- end }}
            revision: {{ .Values.chartVersion | replace "." "-" }}
            global:
              network: {{`'{{name}}'`}}
            multiCluster:
              clusterName: {{`'{{name}}'`}}
      destination:
        server: {{`'{{server}}'`}}
        namespace: istio-system
{{- end }}
