---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: prometheus
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - name: mnger-1
        server: https://kubernetes.default.svc
  template:
    metadata:
      name: {{`'{{name}}-prometheus'`}}
      labels:
        name: prometheus
    spec:
      project: monitoring
      source:
        repoURL: https://prometheus-community.github.io/helm-charts
        targetRevision: {{ .Values.chartVersion }}
        chart: prometheus
        helm:
          releaseName: prometheus
          valuesObject:
            alertmanager:
              enabled: false
            kube-state-metrics:
              enabled: false
            prometheus-node-exporter:
              enabled: false
            prometheus-pushgateway:
              enabled: false
            server:
              # The chart defaults this to 30, which was almost the whole task:
              # the server logs "Start listening for connections" on :9090 56ms
              # after the container starts and has its TSDB up a further 5ms
              # later, yet the pod stayed NotReady until the first probe fired
              # 30s in. Prometheus gates grafana in bootstrap-dag, so that delay
              # was paid twice over on the critical path.
              readinessProbeInitialDelay: 2
              service:
                type: LoadBalancer
                servicePort: 80
                annotations:
                  coredns.io/hostname: prometheus.demo.lab
              extraFlags:
                - web.enable-remote-write-receiver
                - web.enable-lifecycle
                # Unlocks the delete_series and clean_tombstones endpoints, so a
                # leak run can start from an empty TSDB instead of reading its
                # slope across the leftovers of the previous one.
                - web.enable-admin-api
            serverFiles:
              prometheus.yml:
                scrape_configs:
                  - job_name: 'dummy'
                    metrics_path: /nonexistent
                    static_configs:
                      - targets: ['localhost:65535']
      destination:
        server: {{`'{{server}}'`}}
        namespace: monitoring
