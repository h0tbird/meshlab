---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: argocd-sync-and-wait
  annotations:
    workflows.argoproj.io/description: >-
      This task syncs (deploys) an Argo CD application and waits for it to be healthy.
      To do so, it requires the address of the Argo CD server and some form of
      authentication either a username/password or an authentication token.
    workflows.argoproj.io/tags: argocd
    workflows.argoproj.io/version: '>= 2.9.0'
spec:
  entrypoint: argocd-sync-and-wait
  templates:
  - name: argocd-sync-and-wait
    retryStrategy:
      limit: "2"
      backoff:
        duration: "10s"
        factor: "2"
    inputs:
      parameters:
      - name: argocd-version
        value: v3.4.5
      - name: application-name
        value: ""
      - name: revision
        value: HEAD
      - name: selectors
        value: ""
      - name: argocd-server-address
        value: argocd-server.argocd.svc:443
      - name: argocd-credentials-secret
        value: argocd-credentials
    script:
      image: {{`"quay.io/argoproj/argocd:{{inputs.parameters.argocd-version}}"`}}
      command: [bash]
      env:
        - name: ARGOCD_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{`"{{inputs.parameters.argocd-credentials-secret}}"`}}
              key: token
              optional: true
        - name: ARGOCD_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{`"{{inputs.parameters.argocd-credentials-secret}}"`}}
              key: username
              optional: true
        - name: ARGOCD_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{`"{{inputs.parameters.argocd-credentials-secret}}"`}}
              key: password
              optional: true
        - name: ARGOCD_SERVER
          value: {{`"{{inputs.parameters.argocd-server-address}}"`}}
      source: |
        set -ex

        function selectors() {
          echo "$(for i in {{`{{inputs.parameters.selectors}}`}}; do echo -n " -l ${i}"; done)"
        }

        if [[ -z "${ARGOCD_AUTH_TOKEN}" ]] && [[ -z "${ARGOCD_USERNAME}" || -z "${ARGOCD_PASSWORD}" ]]; then
          echo "Either the ARGOCD_AUTH_TOKEN must be specified, or the ARGOCD_USERNAME/ARGOCD_PASSWORD must be specified."
          exit 1
        fi

        if [ -z ${ARGOCD_AUTH_TOKEN} ]; then
          yes | argocd login "${ARGOCD_SERVER}" --username="${ARGOCD_USERNAME}" --password="${ARGOCD_PASSWORD}"
        fi

        # A selector usually matches one Application per cluster, and a blocking
        # "argocd app sync" walks them strictly one at a time: the second cluster
        # only starts once the first is done. Since every cluster does the same
        # independent work, that turns a parallel step into a serial one and the
        # task ends up costing the sum instead of the max. --async just registers
        # the operations and returns, so the controller drives them concurrently;
        # the waits below are what actually block.
        for i in $(seq 1 3); do
          argocd app sync {{`{{inputs.parameters.application-name}}`}} $(selectors) --retry-limit 3 --async && break
          echo "Sync attempt ${i} failed, retrying in 10s..."
          sleep 10
        done

        # The wait is split in two on purpose. "argocd app wait --health" aborts
        # if it ever observes a resource go from a known state to Degraded, and
        # newly created resources routinely dip through Degraded before their
        # controller reconciles them. A blocking sync used to hide that, because
        # the health watch only started once everything was applied. With --async
        # the watch would otherwise start while resources are still appearing and
        # catch the dip: kiali went Missing -> Degraded and failed the step with
        # "health state has transitioned from Missing to Degraded". Waiting for
        # the operation first (without --health, so the check is inactive)
        # restores the original ordering while keeping the syncs parallel.
        argocd app wait {{`{{inputs.parameters.application-name}}`}} --operation $(selectors)
        argocd app wait {{`{{inputs.parameters.application-name}}`}} --health $(selectors)
